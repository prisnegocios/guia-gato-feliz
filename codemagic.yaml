workflows:
  android-workflow:
    name: Android Build
    instance_type: linux_x2
    max_build_duration: 120
    environment:
      java: default
      ndk: r21e
      android_sdk: default
      xcode: default
      groups:
        - keystore_credentials
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch:
        include:
          - main
          - master
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build React app
        script: |
          npm run build
      - name: Install Capacitor
        script: |
          npm install -g @capacitor/cli
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
    publishing:
      email:
        recipients:
          - seu@email.com
        notify:
          success: true
          failure: true
